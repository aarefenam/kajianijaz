# ============================================================
# Kirim ke hosting Hostinger lewat FTPS — JALUR CADANGAN.
#
# Tujuan: public_html/alijazqurancenter.com/
#
# Jalur yang dipakai sehari-hari adalah kebalikannya: hPanel yang
# MENARIK dari GitHub (hPanel → Tingkat lanjut → GIT). Menjalankan
# keduanya sekaligus membuat dua sumber kebenaran berebut menulis ke
# folder yang sama — karena itu alur ini sengaja TIDAK berjalan
# otomatis. Jalankan manual dari tab Actions bila memang diperlukan.
#
# Sebelum dipakai, tambahkan tiga secret di GitHub:
#   Settings → Secrets and variables → Actions → New repository secret
#
#   FTP_SERVER    alamat server — lihat hPanel → File → Akun FTP
#   FTP_USERNAME  nama pengguna — dari halaman yang sama
#   FTP_PASSWORD  kata sandi FTP — dari halaman yang sama
#
# Nilainya sengaja tidak ditulis di sini: repo ini publik, dan
# alamat server beserta nama pengguna adalah separuh kredensial.
#
# Memakai FTPS (FTP terenkripsi) di port 21 — bukan FTP polos.
# ============================================================

name: Kirim ke Hostinger

on:
  workflow_dispatch:        # hanya manual, dari tab Actions

concurrency:
  group: kirim-hosting      # cegah dua pengiriman berbarengan
  cancel-in-progress: false

jobs:
  kirim:
    name: Unggah ke public_html/alijazqurancenter.com
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Periksa sintaks JavaScript
        run: |
          for f in assets/js/*.js; do
            node --check "$f" || exit 1
          done
          echo "Seluruh berkas JavaScript lolos pemeriksaan sintaks."

      - name: Unggah lewat FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          # Domain tambahan di Hostinger berakar di folder senama, bukan
          # langsung di public_html. Folder ini dibuat sendiri oleh aksi
          # bila belum ada.
          server-dir: public_html/alijazqurancenter.com/
          # Berkas yang tidak perlu ikut ke server publik
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.pdf
            README.md
            DEPLOY.md
            .nojekyll
